name: expire
# 2026-10-19 00:07 北京时间（UTC 10-18 16:07）自动停用采集，页面转为静态留存
on:
  schedule:
    - cron: '7 16 18 10 *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  disable-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Disable collect workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/disable"
          echo "collect workflow disabled at $(date -u)"
