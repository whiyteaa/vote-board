name: collect
on:
  schedule:
    - cron: '2-57/5 * * * *'   # 每5分钟，避开整点高峰（UTC）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: |
          npm i --no-save playwright-core@latest playwright@latest
          npx playwright install chromium --with-deps
      - name: Collect votes
        run: node collector.mjs
        env:
          CI: '1'
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u '+%F %T') [skip ci]"
            git push
          fi
