name: collect
# 自续采集链：push 触发 → 采集 → 提交 data.json → 产生新 push → 下一轮
# cron 仅作为断链保险重新点火；2026-10-19 (北京时间) 内置自停，无需外部干预
on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Expire guard (2026-10-19 00:00 北京时间)
        run: |
          if [ "$(date +%s)" -ge "$(date -u -d '2026-10-18T16:00:00Z' +%s)" ]; then
            echo "::notice::已到保留期限(10-19)，采集链自动停止"
            exit 1
          fi
      - name: Throttle (~5min/轮)
        run: |
          AGE=$(curl -s https://raw.githubusercontent.com/whiyteaa/vote-board/main/docs/data.json | head -c 200 | grep -o '"generatedAt":[0-9]*' | grep -o '[0-9]*' || echo 0)
          NOW=$(date +%s%3N)
          WAIT=$(( 300 - (NOW - AGE) / 1000 ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -lt 360 ]; then
            echo "数据 ${WAIT}s 前已更新过，等待 ${WAIT}s 再采集"
            sleep "$WAIT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: |
          npm i --no-save playwright-core@latest playwright@latest
          npx playwright install chromium --with-deps
      - name: Collect votes
        run: node collector.mjs
      - name: Commit data (chain fuel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no change (采集失败?), 链依赖 cron/手动触发重启"
          else
            git commit -m "data: $(date -u '+%F %T')"
            git pull --rebase --autostash || true
            git push
          fi
